# GitHub Pages (Jekyll) settings for asadfaizee.github.io
#
# Sirf portfolio, daauc aur tools live hain.
# Baaki saara purana kaam _archive/ folder ke andar save hai
# (underscore wale folder GitHub Pages publish hi nahi karta).
#
# Photo/video wale ye folders abhi root me hain, isliye inhe yahan
# band rakha gaya hai. Jab ye _archive/ ke andar chale jayenge to
# in lines ki zaroorat nahi rahegi:
exclude:
  - _archive
  - KRO-FLITE
  - STUDIO
  - NINJUTSU-CREATIVE
  - neo
  - STRUCTURE.md
